secret:
  # Specifies whether the secret should be created
  create: true
  # Name of the secret
  name: csi-s3-secret
  # S3 Access Key
  accessKey: "${access_key}"
  # S3 Secret Key
  secretKey: "${secret_key}"
  # Endpoint
  endpoint: "${endpoint}"
  # Insecure
  insecure: ${insecure}
  # Region
  region: "${region}"