%{ if gatewayapi_enabled }
gatewayAPI:
  enabled: true
  enableProxyProtocol: false
  enableAppProtocol: false
  enableAlpn: false
  xffNumTrustedHops: 0
  externalTrafficPolicy: Cluster
  gatewayClass:
    create: auto
  secretsNamespace:
    create: true
    name: cilium-secrets
    sync: true
  hostNetwork:
    enabled: false
%{ endif }
%{ if ingress_enabled }
ingressController:
  enabled: true
  loadbalancerMode: shared
  hostNetwork:
    enabled: true
    httpPort: 80
    httpsPort: 443
    nodes:
      matchLabels:
        ${ingress_label.key}: "${ingress_label.value}"
%{ endif }
kubeProxyReplacement: "true"
k8sServiceHost: ${master_node}
k8sServicePort: 6443
defaultLBServiceIPAM: nodeipam
nodeIPAM:
  enabled: true
egressGateway:
  enabled: %{ if egress_enabled }true%{ else }false%{ endif }
image:
  repository: "${pull_repo}/cilium"
  tag: "${version}"
bpf:
  masquerade: true
  tproxy: false
  hostLegacyRouting: false
envoy:
  enabled: true
  securityContext:
    capabilities:
      keepCapNetBindService: true
      envoy:
        - NET_ADMIN
        - BPF
        - NET_BIND_SERVICE
  image:
    repository: "${pull_repo}/cilium-envoy"
operator:
  image:
    repository: "${pull_repo}/operator"
clustermesh:
  apiserver:
    image:
      repository: "${pull_repo}/clustermesh-apiserver"
certgen:
  image:
    repository: "${pull_repo}/certgen"
hubble:
  enabled: true
  listenAddress: ":4244"
  peerService:
    clusterDomain: ${cluster_domain}
  relay:
    enabled: true
    rollOutPods: true
    image:
      repository: "${pull_repo}/hubble-relay"
  ui:
    enabled: true
    standalone:
      enabled: true
    backend:
      image:
        repository: "${pull_repo}/hubble-ui-backend"
      livenessProbe:
        enabled: false
      readinessProbe:
        enabled: false
    frontend:
      image:
        repository: "${pull_repo}/hubble-ui"
      server:
        ipv6:
          enabled: false
    replicas: 1
    baseUrl: "/"
    ingress:
      enabled: true
      annotations: {}
      className: "cilium"
      hosts:
        - ${hubble_host}
      labels: {}
      tls: []
    tmpVolume: {}
tunnelProtocol: "geneve"
rollOutCiliumPods: true
encryption:
  enabled: true
  type: wireguard
  nodeEncryption: false